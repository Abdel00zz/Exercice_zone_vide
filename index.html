<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Générateur de Fiches d'Exercices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Playfair+Display:wght@700&family=Roboto+Slab:wght@400;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['IBM Plex Sans', 'sans-serif'],
              serif: ['IBM Plex Serif', 'serif'],
              display: ['IBM Plex Sans', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      /* Styles de base pour l'écran */
      body {
        background-color: #f8fafc; /* Gris clair (slate-50) */
        color: #000000;
      }
      
      .text-slate-900,
      .text-slate-800,
      .text-gray-900,
      .text-gray-700 {
        color: #1e293b !important; /* slate-800 pour un bon contraste */
      }
      
      .prose {
        font-family: 'Roboto Slab', serif;
        color: #1e293b !important;
      }
      
      .prose * {
        color: #1e293b !important;
      }
      
      /* Fix MathJax alignment issues in flex containers */
      mjx-container[jax="SVG"] {
        text-align: initial !important;
      }
    </style>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
